# CLI matrix: one record per (command, flag), the single source of truth the
# audit checks against the real command tree (tests/unit/test_cli_matrix.py)
# and renders to docs/audit/cli-matrix.md (scripts/render_cli_matrix.py).
#
# Fields
#   aliases      short forms; secondary: the --no-X form of a boolean pair
#   param        what the flag sets: Class.field[.sub] on the params object the
#                command dispatches, `workdir`, container.<field>, state.<key>,
#                or `n/a: reason`
#   value        sample value used by the wiring test ({wd}, {dir}, {alt_dir},
#                {file}, {alt_file}, {fofn}, {alt_fofn}, {out} are tmp paths);
#                absent for boolean flags
#   with_args    extra arguments needed for the flag to take effect
#   wiring       `n/a: reason` when the reach test cannot run (no second valid value)
#   validated    how a bad value is rejected: choice | registry | unit_interval
#                | range | callback | stage (checked when the stage runs) | none
#   invalid      the bad value the validation test passes (range/callback)
#   reported_as  the name the rejection message uses when it is not the flag
#   docs         Markdown files that mention the long flag
#   nextflow     how the flag reaches the Nextflow layer: params.<key> (a schema
#                parameter, either a typed value or an ext.args string), task.cpus,
#                `module: ...` (fixed by the process script), or `n/a: reason`
#   live         tests/live node id, `n/a: reason`, or `todo: PR-<letter>`
#   observable   what the live test asserts
global_flags:
  --version:
    param: 'n/a: prints the version and exits'
    validated: none
    docs:
    - docs/developing.md
    - docs/cli-reference.md
    - docs/audit/cli-matrix.md
    nextflow: 'n/a: prints the version and exits'
    live: 'n/a: unit test test_version_flag_prints_version'
  --container:
    envvar: REPGENR_CONTAINER
    param: container.backend
    value: docker
    validated: choice
    reported_as: container backend
    docs:
    - docs/usage.md
    - docs/developing.md
    - docs/install.md
    - docs/cli-reference.md
    - docs/audit/scaling-audit.md
    - docs/audit/cli-matrix.md
    nextflow: params.repgenr_opts
    live: tests/live/test_container_runs.py::test_skder_in_a_wave_container_with_cache_and_env
  --container-engine:
    envvar: REPGENR_CONTAINER_ENGINE
    param: container.engine
    value: podman
    validated: none
    docs:
    - docs/install.md
    - docs/cli-reference.md
    - docs/usage.md
    - docs/audit/cli-matrix.md
    nextflow: params.repgenr_opts
    live: tests/live/test_container_runs.py::test_container_engine_podman_is_reported_when_missing
  --container-cache:
    envvar: REPGENR_CONTAINER_CACHE
    param: container.cache_dir
    value: '{alt_dir}'
    validated: none
    docs:
    - docs/install.md
    - docs/cli-reference.md
    - docs/usage.md
    - docs/audit/cli-matrix.md
    nextflow: params.repgenr_opts
    live: tests/live/test_container_runs.py::test_skder_in_a_wave_container_with_cache_and_env
  --platform:
    envvar: REPGENR_CONTAINER_PLATFORM
    param: container.platform
    value: linux/amd64
    validated: none
    docs:
    - docs/usage.md
    - docs/install.md
    - docs/cli-reference.md
    - docs/audit/cli-matrix.md
    nextflow: params.repgenr_opts
    live: tests/live/test_container_runs.py::test_skder_in_a_wave_container_with_cache_and_env
  --wave:
    secondary:
    - --no-wave
    envvar: REPGENR_WAVE
    param: container.wave_enabled
    validated: none
    docs:
    - docs/developing.md
    - docs/install.md
    - docs/cli-reference.md
    - docs/usage.md
    - docs/audit/scaling-audit.md
    - docs/audit/cli-matrix.md
    nextflow: params.repgenr_opts
    live: tests/live/test_container_runs.py::test_native_result_is_not_reused_by_a_container_run
  --bin-dir:
    param: 'n/a: per-tool host directories in core.bindirs, also read from REPGENR_BIN_DIRS (comma-separated, parsed by repgenr); unit test test_the_cli_option_and_variable_configure_the_directories'
    value: gubbins={dir}
    validated: callback
    invalid: nosuchtool=/tmp
    docs:
    - docs/usage.md
    - docs/install.md
    - docs/cli-reference.md
    - docs/audit/cli-matrix.md
    nextflow: params.repgenr_opts
    live: 'n/a: the live suite passes its [bin_dirs] through REPGENR_BIN_DIRS (tests/live/conftest.py)'
  --force:
    aliases:
    - -f
    secondary:
    - --no-force
    envvar: REPGENR_FORCE
    param: state.force
    validated: none
    docs:
    - README.md
    - docs/cli-reference.md
    - docs/audit/cli-matrix.md
    nextflow: 'n/a: resume is Nextflow''s -resume in the data-channel layer'
    live: tests/live/test_aux_commands.py::test_second_run_skips_and_force_reruns
    observable: a completed stage re-runs
  --verbose:
    aliases:
    - -v
    param: state.log_level
    validated: none
    docs:
    - docs/usage.md
    - docs/cli-reference.md
    - docs/audit/cli-matrix.md
    nextflow: params.repgenr_opts
    live: tests/live/test_aux_commands.py::test_logging_flags_and_env
    observable: DEBUG lines in repgenr.log
  --quiet:
    aliases:
    - -q
    param: state.log_level
    validated: none
    docs:
    - docs/cli-reference.md
    - docs/audit/cli-matrix.md
    nextflow: params.repgenr_opts
    live: tests/live/test_aux_commands.py::test_logging_flags_and_env
    observable: no INFO lines on the console
